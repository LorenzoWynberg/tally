<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Tally</title>
    <meta
      name="description"
      content="Tally: a calm, minimal tap counter. Tap +1 to count; your count is saved on this device."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="tally">
      <h1 class="visually-hidden">Tally</h1>
      <p class="date" id="today"></p>
      <p class="count">
        <span class="visually-hidden">Taps: </span><span id="count">0</span>
      </p>
      <p class="total" id="total">Total taps <span id="total-value">0</span></p>
      <section class="history" id="history" hidden>
        <h2 id="history-heading" class="history-heading">Recent counts</h2>
        <ol
          id="history-list"
          class="history-list"
          aria-labelledby="history-heading"
        ></ol>
      </section>
      <div class="actions">
        <button
          type="button"
          id="subtract-one-button"
          class="subtract-one-button"
          aria-label="−1, subtract one"
          aria-disabled="true"
        >
          −1
        </button>
        <button
          type="button"
          id="tap-button"
          class="tap-button"
          aria-label="+1, add one"
        >
          +1
        </button>
        <button
          type="button"
          id="add-five-button"
          class="add-five-button"
          aria-label="+5, add five"
        >
          +5
        </button>
      </div>
      <button type="button" id="reset-button" class="reset-button">
        Reset
      </button>
      <p
        id="live-region"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
