<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Tally</title>
    <meta
      name="description"
      content="Tally is a tiny tap counter: tap to add one, and it remembers your count on this device."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="tally">
      <h1 class="visually-hidden">Tally</h1>
      <p class="date" id="today"></p>
      <p class="count">
        <span class="visually-hidden">Taps: </span><span id="count">0</span>
      </p>
      <button
        type="button"
        id="tap-button"
        class="tap-button"
        aria-label="+1, add one"
      >
        +1
      </button>
      <button type="button" id="reset-button" class="reset-button">
        Reset
      </button>
      <p
        id="live-region"
        class="visually-hidden"
        aria-live="polite"
        aria-atomic="true"
      ></p>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
